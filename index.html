<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IN-NO-V8 LABS</title>
    <meta name="description" content="IN-NO-V8 LABS Experimental Projects">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="grid-container" id="main-container">
        <!-- Left Navigation / Projects -->
        <nav class="project-list" id="nav-pane">
            <header class="header">
                <h1>IN-NO-V8 LABS</h1>
                <div class="status-indicator">SYSTEM.ONLINE</div>
            </header>
            
            <ul class="projects">
                <li><button class="project-btn" data-project="acam">[01] A-CAM</button></li>
                <li><button class="project-btn" data-project="collage">[02] COLLAGE MACHINE</button></li>
                <li><button class="project-btn" data-project="bct">[03] B.C.T. ENGINE</button></li>
            </ul>
            
            <footer class="footer-info">
                <span>V 1.0.0</span>
                <span>ROOT</span>
            </footer>
        </nav>

        <!-- Right Object Box -->
        <section class="object-box" id="object-box">
            <!-- Static State content -->
            <div class="wireframe-placeholder" id="wireframe">
                <svg width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="0" y1="0" x2="100%" y2="100%" class="wireframe-line" />
                    <line x1="100%" y1="0" x2="0" y2="100%" class="wireframe-line" />
                    <rect x="0" y="0" width="100%" height="100%" class="wireframe-border" />
                </svg>
                <div class="wireframe-label">AWAITING_SELECTION</div>
            </div>

            <!-- Immersive State content (Hidden initially) -->
            <div class="immersive-content" id="immersive-content">
                <button class="exit-btn" id="exit-btn" aria-label="Exit immersive mode">[ ESC ]</button>
                
                <div class="feed-container">
                    <div class="video-placeholder">
                        <div class="video-mock" id="video-label">A-CAM_FEED_ACTIVE</div>
                    </div>
                </div>

                <div class="live-logic-overlay" id="live-logic"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
